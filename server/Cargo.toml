[package]
name = "pmo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
blake3 = "1.8.7"
password-hash = "0.6.1"
rand = "0.10.2"
reqwest = "0.13.4"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
sqids = "0.4.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
